app-id: com.hdsentinel.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: com.hdsentinel.app
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.impl.portal.desktop.gtk
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=xdg-config/dconf:ro
  - --filesystem=~/.icons:ro
  - --filesystem=/usr/share/icons:ro
  - --share=network

modules:
  - name: hdsentinel
    buildsystem: simple
    build-commands:
      # 1. Beaktiváljuk a Node20 kiterjesztést a build fázisban
      - . /usr/lib/sdk/node20/enable.sh
      
      # 2. Létrehozzuk a könyvtárakat
      - install -d /app/share/hdsentinel /app/bin
      
      # 3. Átmásoljuk a lefordított dist mappát (bundle.js, gtkx.node, assets)
      - cp -r dist/* /app/share/hdsentinel/
      
      # 4. Átmásoljuk magát a Node.js binárist a Flatpak alkalmazás mappájába
      - cp /usr/lib/sdk/node20/bin/node /app/bin/node
      
      # 5. Elkészítjük az indítóscriptet
      - echo '#!/bin/sh' > /app/bin/com.hdsentinel.app
      - echo 'cd /app/share/hdsentinel' >> /app/bin/com.hdsentinel.app
      - echo 'exec /app/bin/node bundle.js "$@"' >> /app/bin/com.hdsentinel.app
      - chmod +x /app/bin/com.hdsentinel.app
    sources:
      - type: dir
        path: .